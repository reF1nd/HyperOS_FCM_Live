plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'io.reF1nd.hyperos.fcmlive'
    compileSdk 37

    buildFeatures { compose true }

    defaultConfig {
        applicationId namespace
        minSdkVersion 27
        targetSdkVersion 37
        versionCode rootProject.ext.commitCount
        versionName "1.5.0-beta1"
    }

    Properties localProperties = new Properties()
    if (project.rootProject.file('local.properties').exists()) {
        localProperties.load(project.rootProject.file('local.properties').newDataInputStream())
    }

    def signingProperties = [
            storeFile: providers.environmentVariable('SIGNING_STORE_FILE').orElse(localProperties.getProperty('storeFile', '')).get(),
            storePassword: providers.environmentVariable('SIGNING_STORE_PASSWORD').orElse(localProperties.getProperty('storePassword', '')).get(),
            keyAlias: providers.environmentVariable('SIGNING_KEY_ALIAS').orElse(localProperties.getProperty('keyAlias', '')).get(),
            keyPassword: providers.environmentVariable('SIGNING_KEY_PASSWORD').orElse(localProperties.getProperty('keyPassword', '')).get()
    ]
    def hasSigningConfig = signingProperties.values().any { !it.isEmpty() }
    if (hasSigningConfig && signingProperties.values().any { it.isEmpty() }) {
        throw new GradleException('Incomplete signing configuration: storeFile, storePassword, keyAlias and keyPassword are all required.')
    }

    signingConfigs {
        if (hasSigningConfig) {
            config {
                storeFile project.rootProject.file(signingProperties.storeFile)
                storePassword signingProperties.storePassword
                keyAlias signingProperties.keyAlias
                keyPassword signingProperties.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (hasSigningConfig) {
                signingConfig signingConfigs.config
            }
        }
        release {
            if (hasSigningConfig) {
                signingConfig signingConfigs.config
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            proguardFiles 'proguard-rules.pro'
            vcsInfo.include false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    packagingOptions {
        resources {
            excludes += ['kotlin/**', 'META-INF/androidx/**']
        }
    }

    lint {
        checkReleaseBuilds false
    }

    dependenciesInfo.includeInApk false
}

base {
    archivesName = project.name + "-" + android.defaultConfig.versionName + "." + android.defaultConfig.versionCode
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.10.0'
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    compileOnly project(":hiddenapi:stubs")
    implementation project(":hiddenapi:bridge")
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.github.libxposed:api:102.0.0'

    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui:1.12.0'
    implementation 'androidx.compose.foundation:foundation:1.12.0'
    implementation 'androidx.compose.runtime:runtime:1.12.0'
    implementation 'androidx.compose.runtime:runtime-saveable:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'io.coil-kt.coil3:coil-compose:3.6.3'
    implementation 'me.zhanghai.android.appiconloader:appiconloader:1.5.0'
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-preference:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-icons:0.9.4'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}
